name: Lessons (Spark and Delta)

on:
  push:
    branches: [main]
    paths:
      - "js/app.js"
      - "tools/extract-lessons.js"
      - "tools/run-lessons.py"
      - "tools/lesson-checks.py"
      - ".github/workflows/lessons.yml"
  pull_request:
    paths:
      - "js/app.js"
      - "tools/extract-lessons.js"
      - "tools/run-lessons.py"
      - "tools/lesson-checks.py"
      - ".github/workflows/lessons.yml"

permissions:
  contents: read

concurrency:
  group: lessons-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark35-delta32:
    name: Phase 2/3 lessons — Spark 3.5 / Delta 3.2 (Fabric Runtime 1.3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Install pinned pyspark and delta-spark
        run: |
          set -euo pipefail
          pip install pyspark==3.5.3 delta-spark==3.2.0
      - name: Extract lessons from js/app.js
        run: |
          set -euo pipefail
          node tools/extract-lessons.js --out=tools/.extracted/lessons.json
      - name: Run every phase 2/3 lesson in one local SparkSession
        run: |
          set -euo pipefail
          python3 tools/run-lessons.py --extracted tools/.extracted/lessons.json --report tools/.extracted/lesson-report.json
      - name: Upload lesson report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lesson-report-spark35-delta32
          path: tools/.extracted/lesson-report.json
          if-no-files-found: warn
          retention-days: 30

  spark4-delta4-preview:
    name: Phase 2/3 lessons — newest Spark 4.x / Delta 4.x (preview, records differences)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Install newest stable pyspark 4.x and delta-spark 4.x
        # This tracks the newest published 4.x releases, not a verified
        # exact match to Fabric Runtime 2.0's specific Spark 4.1 / Delta 4.2
        # build — that exact pairing was not something this session could
        # confirm from official docs. Any failure here (including a hard
        # version-incompatibility error) is itself useful signal for this
        # preview job; it never blocks the main lessons gate above.
        run: |
          set -euo pipefail
          pip install pyspark==4.1.3 delta-spark==4.3.1
      - name: Extract lessons from js/app.js
        run: |
          set -euo pipefail
          node tools/extract-lessons.js --out=tools/.extracted/lessons.json
      - name: Run every phase 2/3 lesson in one local SparkSession
        run: |
          set -euo pipefail
          python3 tools/run-lessons.py --extracted tools/.extracted/lessons.json --report tools/.extracted/lesson-report-spark4.json
      - name: Upload lesson report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lesson-report-spark4-delta4-preview
          path: tools/.extracted/lesson-report-spark4.json
          if-no-files-found: warn
          retention-days: 30
